server.port=8080
spring.application.name=bus-reservation

# ---- Database (values come from environment variables; defaults are for local runs) ----
# Local default connects to MySQL on your own computer.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_reservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created by database/init.sql, NOT by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# ---- CORS: allowed frontend origins (comma separated) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
